<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC 皇冠大使安麗體驗館導覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 強化版金屬漸層邊框 */
        .gold-ring {
            background: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            padding: 3px; /* 邊框寬度 */
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.2);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .quote-symbol {
            font-family: serif;
            font-size: 1.8rem;
            color: #d4af37;
            opacity: 0.6;
            margin-right: 4px;
        }

        .card-active:active {
            transform: scale(0.97);
            background-color: #fffbeb;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-slate-900 pb-8">

    <header class="relative py-10 px-6 text-center overflow-hidden">
        <div class="relative z-10 animate__animated animate__fadeIn">
            <div class="inline-flex items-center justify-center w-20 h-20 mb-4 rounded-full bg-white shadow-2xl gold-ring float-animation">
                <span class="text-3xl">👑</span>
            </div>
            <h1 class="text-3xl font-black tracking-tight text-slate-800 mb-2">FC 皇冠大使</h1>
            <p class="text-amber-700 font-bold tracking-widest text-sm">安麗體驗館導覽說故事</p>
            <div class="h-1 w-16 bg-gradient-to-r from-transparent via-amber-400 to-transparent mx-auto mt-4"></div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-5">
        <div id="ambassador-container" class="space-y-4">
            <!-- 內容由 JavaScript 動態生成 -->
        </div>

        <footer class="mt-12 mb-8 text-center animate__animated animate__fadeIn">
            <div class="inline-block px-4 py-1 border-t border-slate-200">
                <p class="text-xs text-slate-500 font-bold tracking-wider opacity-80">
                    APP設計：杜杜龍 2026/5/12
                </p>
            </div>
        </footer>
    </main>

    <script>
        const ambassadors = [
            { name: "陳婉芬 嵇龍生", quote: "成功不是你贏過多少人，而是你幫助過多少人。", id: "2", url: "https://www.amway.com.tw/wechat/aep/member/member2.html" },
            { name: "傅後堅", quote: "每個人都應該給自己一個機會，一個可以改變一生的機會。", id: "3", url: "https://www.amway.com.tw/wechat/aep/member/member3.html" },
            { name: "王儷凱", quote: "一個人的成就，絕不會超過他的夢想。", id: "9", url: "https://www.amway.com.tw/wechat/aep/member/member9.html" },
            { name: "許旭昇 謝淑芬", quote: "誠信是我們事業的核心，也是給夥伴最好的承諾。", id: "7", url: "https://www.amway.com.tw/wechat/aep/member/member7.html" },
            { name: "雷宇鳴", quote: "成功不是將來才有的，而是從決定去做的那一刻起，持續累積而成。", id: "1", url: "https://www.amway.com.tw/wechat/aep/member/member1.html" },
            { name: "鍾易宏", quote: "堅持，是通往成功的唯一捷徑。", id: "5", url: "https://www.amway.com.tw/wechat/aep/member/member5.html" },
            { name: "楊嘉譁 陳仕騏", quote: "追求卓越，成功自然就會跟隨你。", id: "4", url: "https://www.amway.com.tw/wechat/aep/member/member4.html" },
            { name: "曾玉玲 呂森林", quote: "在安麗，我們不只看到事業，更看到生命的無限可能。", id: "6", url: "https://www.amway.com.tw/wechat/aep/member/member6.html" },
            { name: "游麗珠 謝建宗", quote: "選擇大於努力，正確的選擇讓努力更有價值。", id: "8", url: "https://www.amway.com.tw/wechat/aep/member/member8.html" },
            { name: "涂永松 黃玉燕", quote: "把簡單的事情重覆做，就是專家；把重覆的事情用心做，就是贏家。", id: "10", url: "https://www.amway.com.tw/wechat/aep/member/member10.html" },
            { name: "楊貫一 鄭家華", quote: "知識可以改變命運，學習可以創造未來。", id: "12", url: "https://www.amway.com.tw/wechat/aep/member/member12.html" },
            { name: "許明哲 張瓅文", quote: "勇於嘗試，是邁向非凡人生的第一步。", id: "11", url: "https://www.amway.com.tw/wechat/aep/member/member11.html" },
            { name: "施素真", quote: "做自己生命中的貴人，活出最亮麗的人生。", id: "13", url: "https://www.amway.com.tw/wechat/aep/member/member13.html" }
        ];

        function initApp() {
            const container = document.getElementById('ambassador-container');
            
            ambassadors.forEach((person, index) => {
                const card = document.createElement('div');
                card.className = `animate__animated animate__fadeInUp`;
                card.style.animationDelay = `${index * 0.08}s`;
                
                // 唯一使用本地路徑
                const imgPath = `img/${person.id}.jpg`;

                card.innerHTML = `
                    <div onclick="window.open('${person.url}', '_blank')" 
                         class="glass-card card-active group relative flex items-center p-4 rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 cursor-pointer overflow-hidden border border-slate-200">
                        
                        <!-- 頭像區塊：獨立的金邊容器 -->
                        <div class="flex-shrink-0">
                            <div class="w-20 h-20 gold-ring rounded-full overflow-hidden">
                                <div class="w-full h-full rounded-full overflow-hidden bg-slate-100">
                                    <img src="${imgPath}" 
                                         alt="${person.name}"
                                         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                                         onerror="handleImageError(this)">
                                </div>
                            </div>
                        </div>

                        <!-- 文字區塊 -->
                        <div class="ml-4 flex-grow">
                            <h2 class="text-lg font-black text-slate-800 mb-1 group-hover:text-amber-700 transition-colors">
                                ${person.name}
                            </h2>
                            <div class="flex items-start">
                                <span class="quote-symbol">“</span>
                                <p class="text-[13px] leading-relaxed text-slate-600 font-medium italic">
                                    ${person.quote}
                                </p>
                            </div>
                        </div>

                        <!-- 箭頭 -->
                        <div class="ml-2 text-amber-500 opacity-30 group-hover:opacity-100 group-hover:translate-x-1 transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleImageError(img) {
            const container = img.parentElement;
            img.style.display = 'none';
            container.classList.add('flex', 'items-center', 'justify-center', 'bg-amber-50');
            container.innerHTML = `<span class="text-amber-600 font-black text-2xl">${img.alt.charAt(0)}</span>`;
        }

        window.onload = initApp;
    </script>
</body>
</html>
