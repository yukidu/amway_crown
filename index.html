<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC皇冠大使成功故事</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #020617;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%);
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .premium-gold-text {
            background: linear-gradient(to right, #bf953f 20%, #fcf6ba 40%, #b38728 60%, #fbf5b7 80%, #aa771c 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 4s linear infinite;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .user-card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0.05) 100%);
            border: 2px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .gold-ring {
            background: linear-gradient(145deg, #bf953f, #fcf6ba, #aa771c);
            padding: 3px;
            box-shadow: 0 0 15px rgba(184, 134, 11, 0.4);
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        /* 隱藏原生 File Input */
        #photo-upload { display: none; }

        input::placeholder, textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body class="pb-12">

    <header class="pt-16 pb-10 px-8 text-center">
        <div class="animate__animated animate__fadeInDown">
            <h1 class="text-3xl md:text-4xl font-black tracking-wider leading-tight">
                <span id="display-name" class="premium-gold-text block mb-2">皇冠大使 您好！</span>
                <!-- 強制不換行與適應手機寬度的問候語 -->
                <span id="display-greeting" class="text-white opacity-90 text-[14px] xs:text-base sm:text-2xl whitespace-nowrap overflow-hidden block">
                    午安
                </span>
            </h1>
        </div>
    </header>

    <div id="input-modal" class="fixed inset-0 z-50 flex items-center justify-center px-6 hidden">
        <div class="modal-overlay absolute inset-0"></div>
        <div class="glass-card w-full max-w-sm rounded-[2.5rem] p-10 relative animate__animated animate__zoomIn">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-amber-500/10 rounded-full mb-4">
                    <span class="text-4xl">👑</span>
                </div>
                <h3 class="text-2xl font-black premium-gold-text">開啟您的傳奇故事</h3>
                <p class="text-slate-400 text-xs mt-2">Helping People Live Better Lives</p>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="text-[11px] font-black text-amber-500 ml-2 mb-2 block uppercase tracking-[0.2em]">您的姓名</label>
                    <input type="text" id="input-name" placeholder="留下您的大名..." class="w-full p-4 rounded-2xl bg-white/5 border border-amber-500/30 focus:border-amber-400 outline-none text-white font-bold transition-all">
                </div>
                <div>
                    <label class="text-[11px] font-black text-amber-500 ml-2 mb-2 block uppercase tracking-[0.2em]">您的座右銘</label>
                    <textarea id="input-motto" placeholder="留下一句激勵夥伴的話..." class="w-full p-4 rounded-2xl bg-white/5 border border-amber-500/30 focus:border-amber-400 outline-none h-24 resize-none text-white transition-all"></textarea>
                </div>
                <button onclick="saveProfile()" class="w-full bg-gradient-to-r from-amber-600 to-amber-400 py-5 rounded-2xl text-slate-900 font-black text-lg shadow-lg active:scale-95 transition-all">
                    確認進入
                </button>
            </div>
        </div>
    </div>

    <main class="max-w-md mx-auto px-5">
        <div id="ambassador-container" class="space-y-6">
            <!-- 內容由 JavaScript 動態生成 -->
        </div>

        <!-- 隱藏的照片上傳按鈕 -->
        <input type="file" id="photo-upload" accept="image/*" onchange="handlePhotoUpload(this)">

        <footer class="mt-12 text-center space-y-8">
            <div class="pt-8 border-t border-white/10">
                <p class="text-sm text-gray-800 font-black tracking-[0.3em] uppercase">
                    APP設計：杜杜龍 2026/5/12
                </p>
                <div class="flex justify-center gap-3 mt-4 opacity-30">
                    <div class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></div>
                    <div class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
                    <div class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
                </div>
            </div>

            <button onclick="resetApp()" class="px-8 py-3 rounded-full border border-white/10 text-slate-600 text-xs font-bold tracking-widest hover:bg-white/5 active:scale-95 transition-all">
                重新設定個人化資料
            </button>
        </footer>
    </main>

    <script>
        const ambassadors = [
            { id: "2", name: "陳婉芬 嵇龍生", quote: "成功不是你贏過多少人，而是你幫助過多少人。", url: "https://www.amway.com.tw/wechat/aep/member/member2.html" },
            { id: "3", name: "傅後堅", quote: "每個人都應該給自己一個機會，一個可以改變一生的機會。", url: "https://www.amway.com.tw/wechat/aep/member/member3.html" },
            { id: "9", name: "王儷凱", quote: "一個人的成就，絕不會超過他的夢想。", url: "https://www.amway.com.tw/wechat/aep/member/member9.html" },
             { id: "7", name: "許旭昇 謝淑芬", quote: "誠信是我們事業的核心，也是給夥伴最好的承諾。", url: "https://www.amway.com.tw/wechat/aep/member/member7.html" },
            { id: "1", name: "雷宇鳴", quote: "成功不是將來才有的，而是從決定去做的那一刻起，持續累積而成。", url: "https://www.amway.com.tw/wechat/aep/member/member1.html" },
             { id: "5", name: "鍾易宏", quote: "堅持，是通往成功的唯一捷徑。", url: "https://www.amway.com.tw/wechat/aep/member/member5.html" },
            { id: "4", name: "楊嘉譁 陳仕騏", quote: "追求卓越，成功自然就會跟隨你。", url: "https://www.amway.com.tw/wechat/aep/member/member4.html" },
            { id: "6", name: "曾玉玲 呂森林", quote: "在安麗，我們不只看到事業，更看到生命的無限可能。", url: "https://www.amway.com.tw/wechat/aep/member/member6.html" },
            { id: "8", name: "游麗珠 謝建宗", quote: "選擇大於努力，正確的選擇讓努力更有價值。", url: "https://www.amway.com.tw/wechat/aep/member/member8.html" },
            { id: "10", name: "涂永松 黃玉燕", quote: "把簡單的事情重覆做，就是專家；把重覆的事情用心做，就是贏家。", url: "https://www.amway.com.tw/wechat/aep/member/member10.html" },
             { id: "12", name: "楊貫一 鄭家華", quote: "知識可以改變命運，學習可以創造未來。", url: "https://www.amway.com.tw/wechat/aep/member/member12.html" },
            { id: "11", name: "許明哲 張瓅文", quote: "勇於嘗試，是邁向非凡人生的第一步。", url: "https://www.amway.com.tw/wechat/aep/member/member11.html" },
            { id: "13", name: "施素真", quote: "做自己生命中的貴人，活出最亮麗的人生。", url: "https://www.amway.com.tw/wechat/aep/member/member13.html" }
        ];

        let profile = { name: '', motto: '', photo: null };

        function initApp() {
            const saved = localStorage.getItem('fc_profile_v2');
            if (saved) {
                profile = JSON.parse(saved);
                renderUI();
            } else {
                document.getElementById('input-modal').classList.remove('hidden');
            }
        }

        function getGreeting() {
            const hour = new Date().getHours();
            if (hour < 5) return "別熬夜太晚啊！你很重要～";
            if (hour < 11) return "早安 你今天營養早餐吃什麼？";
            if (hour < 14) return "午安 準備和哪位夥伴談OPP呢？";
            if (hour < 18) return "下午好 你最推薦R＆J哪款特調飲呢？";
            if (hour < 21) return "晚上好 正在前往教室或聚會的路上嗎？";
            return "充實的一天 今天有什麼收穫呢？";
        }

        function saveProfile() {
            const name = document.getElementById('input-name').value.trim();
            const motto = document.getElementById('input-motto').value.trim();
            if (!name) return;

            profile.name = name;
            profile.motto = motto;
            
            localStorage.setItem('fc_profile_v2', JSON.stringify(profile));
            const modal = document.getElementById('input-modal');
            modal.classList.add('animate__fadeOut');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('animate__fadeOut');
                renderUI();
            }, 500);
        }

        function handlePhotoUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const MAX_WIDTH = 1024;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    profile.photo = compressedDataUrl;
                    localStorage.setItem('fc_profile_v2', JSON.stringify(profile));
                    renderUI();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderUI() {
            document.getElementById('display-name').innerText = `${profile.name} 皇冠大使 您好！`;
            document.getElementById('display-greeting').innerText = getGreeting();
            
            const container = document.getElementById('ambassador-container');
            container.innerHTML = '';

            // 1. 渲染使用者專屬卡片
            const userCard = createCard({
                name: profile.name,
                quote: profile.motto || "點擊左側上傳照片，開啟您的傳奇故事...",
                isUser: true,
                photo: profile.photo
            });
            container.appendChild(userCard);

            // 2. 渲染大使名單
            ambassadors.forEach((person, idx) => {
                const card = createCard(person);
                card.style.animationDelay = `${(idx + 1) * 0.1}s`;
                container.appendChild(card);
            });
        }

        function createCard(data) {
            const isUser = data.isUser || false;
            const cardWrap = document.createElement('div');
            cardWrap.className = `animate__animated animate__fadeInUp`;
            
            const imgContent = isUser 
                ? (data.photo ? `<img src="${data.photo}" class="w-full h-full object-cover rounded-full">` : `<div class="w-full h-full flex items-center justify-center bg-slate-800 text-3xl">👑</div>`)
                : `<img src="img/${data.id}.jpg" alt="${data.name}" class="w-full h-full object-cover rounded-full" onerror="handleImageError(this)">`;

            const showPenIcon = isUser && !data.photo;

            cardWrap.innerHTML = `
                <div onclick="${isUser ? 'document.getElementById(\'photo-upload\').click()' : `window.open('${data.url}', '_blank')`}" 
                     class="glass-card ${isUser ? 'user-card scale-105 my-8' : ''} active:scale-95 flex items-center p-5 rounded-[2.5rem] transition-all duration-300 cursor-pointer group relative overflow-hidden">
                    
                    <div class="flex-shrink-0 relative z-10">
                        <div class="w-20 h-20 gold-ring rounded-full">
                            <div class="w-full h-full rounded-full overflow-hidden bg-slate-900 flex items-center justify-center">
                                ${imgContent}
                            </div>
                        </div>
                        ${showPenIcon ? '<div class="absolute -bottom-1 -right-1 bg-amber-500 text-slate-900 rounded-full p-1 shadow-lg animate-pulse"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path></svg></div>' : ''}
                    </div>

                    <div class="ml-5 flex-grow relative z-10">
                        <h2 class="text-xl font-black ${isUser ? 'premium-gold-text' : 'text-white'} mb-1">
                            ${data.name}
                        </h2>
                        <div class="flex items-start">
                            <span class="text-amber-500 font-serif text-2xl leading-none mr-1 opacity-50">“</span>
                            <p class="text-[13px] leading-relaxed text-slate-300 italic font-medium">
                                ${data.quote}
                            </p>
                        </div>
                    </div>
                </div>
            `;
            return cardWrap;
        }

        function handleImageError(img) {
            const parent = img.parentElement;
            img.style.display = 'none';
            parent.innerHTML = `<span class="text-amber-500 font-black text-2xl">${img.alt.charAt(0)}</span>`;
        }

        function resetApp() {
            localStorage.removeItem('fc_profile_v2');
            location.reload();
        }

        window.onload = initApp;
    </script>
</body>
</html>
